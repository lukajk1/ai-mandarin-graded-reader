[project]
name = "mandarin-core"
version = "0.1.0"
description = "Segmentation, vocabulary profiles, passage checking and generation"
requires-python = ">=3.12"
dependencies = [
    "jieba>=0.42.1",
    "httpx>=0.27",
]

[project.scripts]
mandarin = "mandarin_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandarin_core"]
